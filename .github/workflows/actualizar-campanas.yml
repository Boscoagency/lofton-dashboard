# Baja el rendimiento de Meta Ads y Google Ads y lo publica en rendimiento.html.
# Corre solo todos los días y también a mano desde Actions > Run workflow.
name: Actualizar datos de campañas

on:
  schedule:
    - cron: "17 13 * * *" # 7:17 a. m. hora del centro de México (UTC-6, sin horario de verano)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-campanas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Bajar datos de Meta y Google
        run: python3 scripts/actualizar_campanas.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}

      # Se guarda aunque una plataforma haya fallado: la página muestra el aviso
      # y conserva los últimos datos buenos.
      - name: Guardar datos en el repositorio
        if: always()
        run: |
          [ -f data/rendimiento.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/rendimiento.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualiza datos de campañas"
          git pull --rebase origin main
          git push origin HEAD:main

      # Los push del bot no siempre disparan la publicación de GitHub Pages.
      - name: Publicar en GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "No se pudo pedir la publicación; se publicará con el siguiente cambio."
